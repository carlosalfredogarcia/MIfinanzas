# Pasa las pruebas de tests/ en cada subida: si algo se rompe, GitHub lo marca en rojo antes de publicar
name: Pruebas
on:
  push:
  pull_request:
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # Los servidores de GitHub ya traen Google Chrome: no hace falta descargar otro navegador
      - run: npm test
        env:
          CHROME_PATH: /usr/bin/google-chrome
