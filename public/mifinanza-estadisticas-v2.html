<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MiFinanza – Estadísticas</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="js/datepicker.js"></script>
<link rel="stylesheet" href="css/estadisticas.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MiFinanza">
<meta name="theme-color" content="#0a0e1a">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/auth.js"></script>
<script src="js/comun.js"></script>
</head>
<body>
<div class="phone">
  <div class="blob blob-g" aria-hidden="true"></div>
  <div class="blob blob-i" aria-hidden="true"></div>

  <div class="header">
    <h1 class="header-title">Estadísticas</h1>
    <div class="header-sub">Entiende tus patrones de gasto</div>
  </div>

  <div class="modo-tabs" role="tablist" aria-label="Tipo de análisis">
    <button type="button" role="tab" class="modo-tab" id="tab-periodo" onclick="setModo('periodo')">Por período</button>
    <button type="button" role="tab" class="modo-tab active" id="tab-mes" onclick="setModo('mes')">Por mes</button>
    <button type="button" role="tab" class="modo-tab" id="tab-anio" onclick="setModo('anio')">Año completo</button>
  </div>

  <div id="vista-periodo">
    <div class="periodo-wrap">
      <div class="periodo-label">Toca los meses que quieres comparar</div>
      <div class="meses-sel-grid" id="meses-sel-grid"></div>
      <div class="meses-sel-count" id="meses-sel-count"></div>
    </div>
  </div>

  <div id="vista-mes" style="display:none">
    <div class="buscador-wrap">
      <div class="meses-grid" id="meses-grid"></div>
    </div>
  </div>

  <div id="loading-wrap" class="loading-wrap">Cargando datos...</div>

  <div id="contenido" style="display:none">

    <section class="hero" aria-label="Resultado">
      <div class="hero-veredicto">
        <span class="hero-lbl" id="lbl-aho">Ahorro</span>
        <span class="hero-val num" id="val-aho">—</span>
        <span class="hero-sub"><span id="sub-aho"></span><span id="tasa-aho"></span></span>
      </div>
      <div class="hero-par">
        <div class="hero-item">
          <span class="hero-mini" id="lbl-ing">Ingresos</span>
          <span class="hero-num num ing" id="val-ing">—</span>
          <span class="hero-mini2" id="sub-ing"></span>
        </div>
        <div class="hero-item">
          <span class="hero-mini" id="lbl-gas">Gastos</span>
          <span class="hero-num num gas" id="val-gas">—</span>
          <span class="hero-mini2" id="sub-gas"></span>
        </div>
      </div>
    </section>

    <section class="tarjeta" id="donut-card" aria-labelledby="donut-t">
      <div class="t-head"><h2 class="t-titulo" id="donut-t">¿A dónde va tu dinero?</h2><span class="t-leyenda" id="cats-title"></span></div>
      <div class="donut-solo">
        <svg class="donut" id="donut" viewBox="0 0 160 160" role="img" aria-label="Reparto del gasto por categoría"></svg>
      </div>
      <div class="cat-cab" id="cat-cab" aria-hidden="true"></div>
      <div id="cats-wrap" role="list"></div>
    </section>

    <section class="analisis-card" id="analisis-card" aria-labelledby="analisis-t">
      <h2 class="analisis-title" id="analisis-t">Evolución por categoría</h2>
      <div class="cat-chips" id="cat-chips" role="toolbar" aria-label="Elegir categoría"></div>
      <select class="cat-select" id="cat-select" onchange="renderAnalisis()" aria-label="Categoría"></select>
      <div class="evol" id="evol-barras"></div>
      <div class="evol-leyenda" id="evol-leyenda"></div>
      <p class="analisis-nota" id="analisis-nota"></p>
    </section>

    <section class="tarjeta" id="busca-card" aria-labelledby="busca-t">
      <h2 class="t-titulo" id="busca-t">Última vez y frecuencia</h2>
      <div class="busca">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="busca-input" placeholder="Ej.: aceite, pelo, Mercadona" aria-label="Buscar un gasto en todos los meses" autocomplete="off">
      </div>
      <div id="busca-res"></div>
    </section>

  </div>

  <div class="spacer"></div>
</div>

<div class="modal-base" id="modal-editar-item">
  <div class="modal-box">
    <div class="modal-handle"></div>
    <div class="modal-title" id="edit-title">Editar movimiento</div>
    <div class="fld" id="fld-em-descripcion"><label class="lbl">Descripción</label><input type="text" id="em-descripcion" class="inp"></div>
    <div class="fld" id="fld-em-nombre"><label class="lbl">Nombre</label><input type="text" id="em-nombre" class="inp"></div>
    <div class="fld" id="fld-em-categoria"><label class="lbl">Categoría</label>
      <select id="em-categoria" class="inp"></select>
    </div>
    <div class="fld" id="fld-em-cat-fijo"><label class="lbl">Categoría</label>
      <select id="em-cat-fijo" class="inp"></select>
    </div>
    <div class="fld"><label class="lbl">Monto</label><input type="number" id="em-monto" class="inp" placeholder="$0.00"></div>
    <div class="fld" style="margin-bottom:18px" id="fld-em-fecha"><label class="lbl" id="lbl-em-fecha">Fecha</label><span class="dp-wrap"><input type="hidden" id="em-fecha" class="dp-real-input"><button type="button" class="inp dp-btn" data-dp-for="em-fecha" onclick="openDatePicker('em-fecha')"><span class="dp-txt" data-empty="true">Seleccionar fecha</span><svg class="dp-cal-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="16" height="15" rx="2"/><path d="M2 8h16M7 1v4M13 1v4"/></svg></button></span></div>
    <button onclick="guardarEdicionItem()" class="btn-ok">Guardar cambios</button>
    <button onclick="cerrarEdicionItem()" class="btn-no">Cancelar</button>
  </div>
</div>
<script src="js/estadisticas.js"></script>
<script src="js/nav.js"></script>
</body>
</html>
