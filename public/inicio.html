<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MiFinanza – Dashboard</title>
<script src="js/idioma.js"></script>
<script src="js/android.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/inicio.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" sizes="48x48" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MiFinanza">
<meta name="theme-color" content="#0a0e1a">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
<script src="js/auth.js"></script>
<script src="js/comun.js"></script>
</head>
<body>
<div class="phone">
  <div class="blob blob-g" aria-hidden="true"></div>
  <div class="blob blob-i" aria-hidden="true"></div>

  <!-- HEADER -->
  <header class="header" id="header-saludo" style="visibility:hidden">
    <div>
      <div class="header-day" id="header-dia">Hoy</div>
      <div class="greeting"><h1 class="nombre" id="saludo-nombre">Hola</h1></div>
    </div>
    <div class="header-btns">
      <button type="button" class="mf-ayuda" data-ayuda><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 0 1 4.9.7c0 1.7-2.5 2.2-2.5 3.6"/><path d="M12 17h.01"/></svg>Ayuda</button>
      <button class="avatar" id="avatar-header" aria-label="Tu perfil" onclick="location.href='mifinanza-perfil.html'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></button>
    </div>
  </header>

  <!-- SELECTOR DE MES -->
  <div class="period-bar">
    <button class="mes-arrow" onclick="mesAnterior()" aria-label="Mes anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
    <div id="mes-badge">—</div>
    <button class="mes-arrow" onclick="mesSiguiente()" aria-label="Mes siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
  </div>

  <!-- SALDO (cristal) -->
  <a href="mifinanza-movimientos.html" class="saldo-card card-link card-in" aria-labelledby="saldo-t">
    <h2 class="saldo-label" id="saldo-t">Saldo actual</h2>
    <div class="saldo-amount num" id="saldo-amount">—</div>
    <figure class="spark-wrap">
      <svg class="spark-svg" id="spark-svg" viewBox="0 0 350 70" role="img" aria-label="Saldo a fin de mes, últimos 6 meses">
        <defs>
          <linearGradient id="sparkfill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#10b981" stop-opacity=".35"/>
            <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <line x1="0" y1="64" x2="350" y2="64" stroke="rgba(148,163,184,.18)" stroke-width="1"/>
        <path id="spark-area" fill="url(#sparkfill)" d=""/>
        <polyline id="spark-line" class="spark-line" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points=""/>
        <circle id="spark-halo" r="9" fill="#10b981" opacity=".25" cx="-20" cy="-20"/>
        <circle id="spark-dot" r="4.5" fill="#10b981" stroke="#0a0e1a" stroke-width="2" cx="-20" cy="-20"/>
      </svg>
      <div class="spark-months" id="spark-months"></div>
    </figure>
    <div class="pills-row">
      <div class="pill">
        <div class="pill-lbl"><span class="pill-dot g"></span>Ingresos</div>
        <div class="pill-val g num" id="total-ingresos">—</div>
      </div>
      <div class="pill">
        <div class="pill-lbl"><span class="pill-dot r"></span>Gastos</div>
        <div class="pill-val r num" id="total-gastos">—</div>
      </div>
    </div>
  </a>

  <!-- SALUD FINANCIERA -->
  <a href="mifinanza-metas.html" class="card salud-card card-link card-in" aria-labelledby="salud-t">
    <h2 class="card-title" id="salud-t">Salud financiera</h2>
    <div class="salud-body">
      <div class="ring-wrap">
        <svg viewBox="0 0 128 128" width="128" height="128" role="img" id="salud-svg" aria-label="Porcentaje de tus ingresos gastado">
          <circle class="ring-bg" cx="64" cy="64" r="54"/>
          <circle class="ring-fg" id="salud-ring" cx="64" cy="64" r="54"/>
        </svg>
        <div class="ring-center">
          <div class="ring-pct num" id="salud-pct">—</div>
          <div class="ring-sub">gastado</div>
        </div>
      </div>
      <div class="salud-right">
        <div class="salud-badge" id="salud-badge">Calculando</div>
        <p class="salud-resto num" id="salud-resto"></p>
      </div>
    </div>
    <div class="salud-bar-wrap">
      <div class="salud-bar-track">
        <span class="t-ok"></span><span class="t-warn"></span><span class="t-danger"></span>
        <span class="salud-bar-marker" id="salud-marker" style="left:0%" aria-hidden="true"></span>
      </div>
      <div class="salud-bar-labels">
        <span>Bajo control · &lt;80 %</span><span>80–95</span><span>95+</span>
      </div>
    </div>
  </a>

  <!-- GASTOS FIJOS -->
  <a href="mifinanza-fijos.html" class="card fijos-card card-link card-in" aria-labelledby="fijos-t">
    <div class="card-head">
      <h2 class="card-title" id="fijos-t">Gastos fijos</h2>
      <span class="section-mes num"><span id="fijos-total">—</span><small> /mes</small></span>
    </div>
    <div id="fijos-lista"><div class="vacio">Cargando...</div></div>
  </a>

  <!-- ÚLTIMO MOVIMIENTO -->
  <section class="card ultimo-card card-in" aria-labelledby="ultimo-t">
    <div class="card-head">
      <h2 class="card-title" id="ultimo-t">Último movimiento</h2>
      <a class="ver-todos" href="mifinanza-movimientos.html">Ver todos →</a>
    </div>
    <div class="ultimo-row">
      <span class="ultimo-icon" id="ultimo-icon" aria-hidden="true">📋</span>
      <div class="ultimo-info">
        <span class="ultimo-desc" id="ultimo-desc">Sin movimientos todavía</span>
        <span class="ultimo-date" id="ultimo-date">Toca + para añadir el primero</span>
      </div>
      <span class="ultimo-amount num" id="ultimo-monto"></span>
    </div>
  </section>

  <div class="spacer"></div>
</div>
<script src="js/inicio.js"></script>
<script src="js/nav.js"></script>
</body>
</html>
