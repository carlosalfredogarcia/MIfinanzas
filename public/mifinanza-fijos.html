<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MiFinanza – Gastos Fijos</title>
<script src="js/idioma.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/fijos.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" sizes="48x48" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MiFinanza">
<meta name="theme-color" content="#0a0e1a">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/auth.js"></script>
<script src="js/comun.js"></script>
</head>
<body>
<div class="phone">
  <div class="blob blob-i" aria-hidden="true"></div>
  <div class="blob blob-g" aria-hidden="true"></div>

  <header class="header">
    <h1>Gastos fijos</h1>
    <p>Lo que sale cada mes sin que tengas que apuntarlo</p>
  </header>

  <div id="contenido"><div class="cargando">Cargando…</div></div>
</div>

<!-- Hoja crear / editar -->
<div id="hoja-raiz">
  <div class="h-fondo" data-cerrar></div>
  <section class="hoja" role="dialog" aria-modal="true" aria-labelledby="h-tit" inert>
    <div class="h-asa"></div>
    <div class="h-cab"><span class="h-tit" id="h-tit">Nuevo gasto fijo</span><button type="button" class="h-x" data-cerrar aria-label="Cerrar">×</button></div>
    <label class="h-importe"><span class="h-mon" id="h-mon-pre"></span><input id="h-monto" inputmode="decimal" autocomplete="off" placeholder="0" aria-label="Importe al mes"><span class="h-mon" id="h-mon-post"></span></label>
    <div class="h-cada">cada mes</div>
    <div class="h-campo"><label class="h-lbl" for="h-nombre">Nombre</label><input class="h-inp" id="h-nombre" placeholder="Ej: Alquiler, Netflix, Gimnasio" autocomplete="off"></div>
    <div class="h-campo"><span class="h-lbl">Categoría</span><div class="cats" id="h-cats"></div></div>
    <div class="h-campo h-fila2">
      <div><label class="h-lbl" for="h-dia">Se cobra el día</label><input class="h-inp num" id="h-dia" type="number" inputmode="numeric" min="1" max="31" placeholder="1"></div>
      <div><label class="h-lbl" for="h-desde">Desde</label><input class="h-inp" id="h-desde" type="month"></div>
    </div>
    <div class="h-campo"><label class="h-lbl" for="h-hasta">Hasta</label>
      <div class="h-inp h-sinfin" id="h-sinfin"><span>Sin fecha de fin</span><button type="button" class="btn-mini" id="h-poner-fin">Poner fecha</button></div>
      <input class="h-inp" id="h-hasta" type="month" hidden>
      <p class="h-nota">Déjalo vacío si no tiene fecha de fin. Para un préstamo, pon el mes de la última cuota.</p></div>
    <button type="button" class="btn-grande" id="h-guardar" disabled>Guardar</button>
    <div class="h-acciones" id="h-acciones" hidden>
      <span class="h-lbl">¿Ya no lo pagas?</span>
      <div class="h-opc">
        <button type="button" data-fin="este">Este mes es el último<small>Cuenta este mes y deja de contar desde el siguiente</small></button>
        <button type="button" data-fin="anterior">Ya no se cobró este mes<small>Deja de contar desde este mes</small></button>
        <button type="button" class="peligro" data-eliminar>Eliminar del todo<small>Lo borra también de los meses pasados y cambia tus estadísticas</small></button>
      </div>
    </div>
  </section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"><span></span><button type="button">Deshacer</button></div>

<script src="js/fijos.js"></script>
<script src="js/nav.js"></script>
</body>
</html>
