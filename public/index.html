<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MiFinanza – Entrar</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/acceso.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MiFinanza">
<meta name="theme-color" content="#b8f564">
</head>
<body>
<div class="phone">
  <div class="logo">
    <div class="logo-icon">💰</div>
    <div class="logo-title">MiFinanza</div>
    <div class="logo-sub">Tu dinero, bajo control</div>
  </div>

  <div class="tabs" id="tabs">
    <div class="tab active" id="tab-entrar" onclick="setTab('entrar')">Entrar</div>
    <div class="tab" id="tab-crear" onclick="setTab('crear')">Crear cuenta</div>
  </div>

  <div class="success-msg" id="success-msg"></div>
  <div class="error-msg" id="error-msg"></div>

  <!-- Formulario login -->
  <div class="form-section active" id="form-entrar">
    <div class="fld">
      <label class="lbl">Correo</label>
      <input type="email" id="login-email" class="inp" placeholder="tu@correo.com" autocomplete="email">
    </div>
    <div class="fld" style="margin-bottom:18px">
      <label class="lbl">Contraseña</label>
      <input type="password" id="login-pass" class="inp" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn-main" style="background:var(--accent);color:#0f0f13" onclick="iniciarSesion()">Entrar</button>
    <button class="btn-link" onclick="setTab('recuperacion')">¿Olvidaste tu contraseña?</button>
  </div>

  <!-- Formulario registro -->
  <div class="form-section" id="form-crear">
    <div class="fld">
      <label class="lbl">Correo</label>
      <input type="email" id="reg-email" class="inp" placeholder="tu@correo.com" autocomplete="email">
    </div>
    <div class="fld">
      <label class="lbl">Contraseña</label>
      <input type="password" id="reg-pass" class="inp" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
    </div>
    <div class="fld" style="margin-bottom:18px">
      <label class="lbl">Confirmar contraseña</label>
      <input type="password" id="reg-pass2" class="inp" placeholder="Repite la contraseña" autocomplete="new-password">
    </div>
    <button class="btn-main" style="background:var(--accent2);color:#0f0f13" onclick="crearCuenta()">Crear cuenta</button>
  </div>

  <!-- Recuperación de contraseña -->
  <div class="form-section" id="form-recuperacion">
    <div class="rec-header">
      <div class="rec-icon">🔑</div>
      <div class="rec-title">¿Olvidaste tu contraseña?</div>
      <div class="rec-sub">Te enviamos un enlace a tu correo</div>
    </div>
    <div class="fld" style="margin-bottom:18px">
      <label class="lbl">Correo</label>
      <input type="email" id="rec-email" class="inp" placeholder="tu@correo.com" autocomplete="email">
    </div>
    <button class="btn-main" style="background:var(--accent);color:#0f0f13" onclick="enviarRecuperacion()">Enviar enlace</button>
    <button class="btn-link" onclick="setTab('entrar')">← Volver</button>
  </div>

  <!-- Nueva contraseña (retorno desde email) -->
  <div class="form-section" id="form-nueva-clave">
    <div class="rec-header">
      <div class="rec-icon">🔒</div>
      <div class="rec-title">Nueva contraseña</div>
      <div class="rec-sub">Elige una contraseña segura</div>
    </div>
    <div class="fld">
      <label class="lbl">Nueva contraseña</label>
      <input type="password" id="nueva-pass" class="inp" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
    </div>
    <div class="fld" style="margin-bottom:18px">
      <label class="lbl">Confirmar contraseña</label>
      <input type="password" id="nueva-pass2" class="inp" placeholder="Repite la contraseña" autocomplete="new-password">
    </div>
    <button class="btn-main" style="background:var(--accent);color:#0f0f13" onclick="guardarNuevaClave()">Guardar contraseña</button>
  </div>
</div>

<div class="loading-overlay visible" id="loading">
  <div class="loading-spinner"></div>
  <div class="loading-text" id="loading-text">Verificando...</div>
  <div class="loading-sub" id="loading-sub"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/acceso.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }
</script>
</body>
</html>
