<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<body>
<div class="phone">
  <div class="blob blob-g" aria-hidden="true"></div>
  <div class="blob blob-r" aria-hidden="true"></div>

  <header class="header">
    <h1>Préstamos</h1>
    <p>Lo que prestas y lo que debes, siempre claro</p>
  </header>

  <section class="resumen" id="resumen" aria-label="Resumen"></section>

  <div class="pestanas" role="tablist" aria-label="Préstamos">
    <button type="button" role="tab" id="tab-preste" data-tab="preste" aria-selected="true">Me deben</button>
    <button type="button" role="tab" id="tab-debo" data-tab="debo" aria-selected="false">Debo</button>
  </div>

  <section id="lista" aria-live="polite"><div class="cargando">Cargando…</div></section>
</div>

<!-- Hoja reutilizable: nuevo préstamo, detalle, abono, editar -->
<div id="hoja-raiz">
  <div class="h-fondo" data-cerrar></div>
  <section class="hoja" role="dialog" aria-modal="true" aria-labelledby="h-tit" inert>
    <div class="h-asa"></div>
    <div class="h-cab"><span class="h-tit" id="h-tit"></span><button type="button" class="h-x" data-cerrar aria-label="Cerrar">×</button></div>
    <div id="h-cuerpo"></div>
  </section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"><span></span><button type="button">Deshacer</button></div>

<script src="js/prestamos.js"></script>
<script src="js/nav.js"></script>
