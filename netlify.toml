[build]
  # Solo se publica public/: el código del servidor, el SQL, las pruebas y la documentación no son accesibles desde la web
  publish = "public"

[build.processing.html]
  pretty_urls = false

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"
