<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MiFinanza – Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="datepicker.js"></script>
<style>
  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --surface2: #1a2234;
    --border: #1f2d45;
    --green: #10b981;
    --green-glow: rgba(16,185,129,0.15);
    --red: #ef4444;
    --gold: #f59e0b;
    --text: #f1f5f9;
    --sub: #64748b;
    --accent: #6366f1;
    --accent-glow: rgba(99,102,241,0.18);
    --danger: #ef4444;
    --success: #10b981;
    --card: #111827;
    --card2: #1a2234;
    --subtext: #64748b;
  }
  html { visibility: hidden }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  .phone {
    width: 390px;
    min-height: 100vh;
    background: var(--bg);
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  .header {
    padding: 56px 24px 16px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    animation: fadeUp 0.4s ease both;
  }
  .header-left {}
  .header-day {
    font-size: 11px;
    color: var(--sub);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 4px;
    font-weight: 600;
  }
  .greeting .nombre {
    font-size: 22px;
    font-weight: 800;
    color: var(--text);
    letter-spacing: -0.02em;
  }
  .avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 16px;
    color: #fff;
    flex-shrink: 0;
    box-shadow: 0 0 0 2px rgba(99,102,241,0.3);
  }

  /* ── PERIOD SELECTOR ── */
  .period-bar {
    padding: 0 24px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .mes-arrow {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--sub);
    font-size: 18px;
    cursor: pointer;
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, color 0.2s;
  }
  .mes-arrow:hover { background: var(--surface2); color: var(--text); }
  .period-center { text-align: center; flex: 1; }
  .mes-label-small {
    font-size: 10px;
    color: var(--sub);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 2px;
    font-weight: 600;
  }
  #mes-badge {
    font-size: 17px;
    font-weight: 800;
    color: var(--text);
    letter-spacing: -0.01em;
  }

  /* ── HERO CARD (glassmorphism) ── */
  .hero-card {
    margin: 0 16px 16px;
    background: linear-gradient(135deg, rgba(99,102,241,0.12) 0%, rgba(16,185,129,0.08) 100%);
    border: 1px solid rgba(99,102,241,0.25);
    border-radius: 24px;
    padding: 20px;
    backdrop-filter: blur(20px);
    animation: fadeUp 0.4s 0.1s ease both;
    opacity: 0;
    position: relative;
    overflow: hidden;
  }
  .hero-card::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 140px; height: 140px;
    background: radial-gradient(circle, rgba(99,102,241,0.15) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .hero-left {}
  .saldo-label {
    font-size: 11px;
    color: var(--sub);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .saldo-amount {
    font-size: 36px;
    font-weight: 800;
    color: var(--text);
    letter-spacing: -0.03em;
    line-height: 1;
  }
  .saldo-amount.positivo { color: var(--green); }
  .saldo-amount.negativo { color: var(--gold); }

  /* Health Ring */
  .health-ring-wrap {
    position: relative;
    width: 72px;
    height: 72px;
    flex-shrink: 0;
  }
  .health-ring-wrap svg {
    transform: rotate(-90deg);
  }
  .health-ring-bg {
    fill: none;
    stroke: rgba(255,255,255,0.06);
    stroke-width: 5;
  }
  .health-ring-fg {
    fill: none;
    stroke: var(--green);
    stroke-width: 5;
    stroke-linecap: round;
    stroke-dasharray: 188;
    stroke-dashoffset: 188;
    transition: stroke-dashoffset 1s ease;
    filter: drop-shadow(0 0 6px rgba(16,185,129,0.5));
  }
  .health-ring-fg.negativo {
    stroke: var(--gold);
    filter: drop-shadow(0 0 6px rgba(245,158,11,0.5));
  }
  .health-pct {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 800;
    color: var(--text);
  }
  .health-pct-sub {
    font-size: 8px;
    color: var(--sub);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
  }

  /* Sparkline */
  .sparkline-wrap {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .sparkline-svg {
    width: 100%;
    height: 40px;
    overflow: visible;
  }
  .sparkline-months {
    display: flex;
    justify-content: space-between;
    margin-top: 4px;
    padding: 0 2px;
  }
  .sparkline-months span {
    font-size: 9px;
    color: var(--sub);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
  }

  /* Pills: Ingresos / Gastos */
  .pills-row {
    display: flex;
    gap: 10px;
    margin: 0 16px 16px;
    animation: fadeUp 0.4s 0.2s ease both;
    opacity: 0;
  }
  .pill {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .pill-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .pill-dot.green { background: var(--green); box-shadow: 0 0 8px rgba(16,185,129,0.5); }
  .pill-dot.red   { background: var(--red);   box-shadow: 0 0 8px rgba(239,68,68,0.5); }
  .pill-info {}
  .pill-lbl {
    font-size: 10px;
    color: var(--sub);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 600;
    margin-bottom: 2px;
  }
  .pill-val {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .pill-val.green { color: var(--green); }
  .pill-val.red   { color: var(--red); }

  /* ── GASTOS FIJOS ── */
  .fijos-card {
    margin: 0 16px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 18px 20px;
    animation: fadeUp 0.4s 0.3s ease both;
    opacity: 0;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .fijos-card:hover { border-color: rgba(99,102,241,0.3); }
  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .section-title {
    font-size: 11px;
    color: var(--sub);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-weight: 700;
  }
  .section-total {
    font-size: 14px;
    font-weight: 800;
    color: var(--sub);
  }
  .fijo-item {
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .fijo-item:last-child { border-bottom: none; }
  .fijo-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .fijo-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .fijo-icon {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
  }
  .fijo-name { font-size: 14px; color: var(--text); font-weight: 600; }
  .fijo-date { font-size: 11px; color: var(--sub); }
  .fijo-amount { font-size: 14px; font-weight: 800; color: var(--red); }
  .fijo-bar-track {
    height: 3px;
    background: rgba(255,255,255,0.06);
    border-radius: 2px;
    overflow: hidden;
  }
  .fijo-bar-fill {
    height: 100%;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--accent), #8b5cf6);
    transition: width 0.8s ease;
  }

  /* ── ÚLTIMO MOVIMIENTO ── */
  .ultimo-card {
    margin: 0 16px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    animation: fadeUp 0.4s 0.4s ease both;
    opacity: 0;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .ultimo-card:hover { border-color: rgba(99,102,241,0.3); }
  .ultimo-icon {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .ultimo-info { flex: 1; }
  .ultimo-label {
    font-size: 10px;
    color: var(--sub);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 2px;
    font-weight: 700;
  }
  .ultimo-desc { font-size: 14px; color: var(--text); font-weight: 600; }
  .ultimo-date { font-size: 11px; color: var(--sub); margin-top: 2px; }
  .ultimo-amount { font-size: 16px; font-weight: 800; color: var(--red); }

  /* ── FAB ── */
  .fab {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(135deg, var(--green), #059669);
    color: #fff;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    border: none;
    font-size: 28px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 32px rgba(16,185,129,0.4), 0 0 0 1px rgba(16,185,129,0.3);
    transition: transform 0.2s, box-shadow 0.2s;
    z-index: 100;
  }
  .fab:hover {
    transform: translateX(-50%) scale(1.08);
    box-shadow: 0 12px 40px rgba(16,185,129,0.55), 0 0 0 1px rgba(16,185,129,0.4);
  }

  /* ── NAVBAR ── */
  .navbar {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 390px;
    background: rgba(10,14,26,0.95);
    backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    padding: 12px 0 24px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 99;
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    opacity: 0.3;
    transition: opacity 0.2s;
    flex: 1;
  }
  .nav-item.active { opacity: 1; }
  .nav-icon { font-size: 22px; }
  .nav-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }

  /* ── MODALS ── */
  .mas-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 2px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    transition: opacity 0.15s;
  }
  .mas-item:last-of-type { border-bottom: none; margin-bottom: 16px; }
  .mas-item:active { opacity: 0.6; }
  .mas-icon {
    width: 42px;
    height: 42px;
    border-radius: 13px;
    background: var(--accent-glow);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    flex-shrink: 0;
  }
  .mas-label { flex: 1; font-size: 15px; font-weight: 600; color: var(--text); }
  .mas-arrow { color: var(--accent); font-size: 18px; }

  .spacer { height: 120px; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── FORMS ── */
  .inp {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    color: var(--text);
    font-family: 'Manrope', 'DM Sans', sans-serif;
    font-size: 15px;
    outline: none;
  }
  .inp:focus { border-color: var(--accent); }
  .lbl {
    font-size: 11px;
    color: var(--sub);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    display: block;
    margin-bottom: 6px;
    font-weight: 700;
  }
  .fld { margin-bottom: 12px; }
  .cat-lbl-row { display: flex; justify-content: space-between; align-items: center; }
  .cat-add-btn {
    color: var(--accent);
    cursor: pointer;
    font-weight: 700;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .cat-nueva-panel { margin-top: 8px; }
  .cat-nueva-row { display: flex; gap: 8px; }
  .btn-cat-add {
    flex: 1;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 10px;
    font-family: 'Manrope', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-cat-cancel {
    flex: 1;
    background: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    color: var(--sub);
    font-family: 'Manrope', sans-serif;
    font-size: 13px;
    cursor: pointer;
  }
  .toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(-80px);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 20px;
    font-size: 13px;
    color: var(--text);
    z-index: 300;
    transition: transform 0.3s ease;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.ok { border-color: rgba(99,102,241,0.4); color: var(--accent); }
  .modal-base {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(8px);
    z-index: 200;
    display: none;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-box {
    width: 390px;
    background: var(--surface);
    border-radius: 28px 28px 0 0;
    padding: 24px 24px 40px;
    border-top: 1px solid var(--border);
  }
  .modal-handle {
    width: 40px;
    height: 4px;
    background: rgba(255,255,255,0.08);
    border-radius: 100px;
    margin: 0 auto 20px;
  }
  .modal-title {
    font-family: 'Manrope', sans-serif;
    font-size: 18px;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 18px;
    letter-spacing: -0.01em;
  }
  .btn-ok {
    width: 100%;
    border: none;
    border-radius: 14px;
    padding: 15px;
    font-family: 'Manrope', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 8px;
  }
  .btn-no {
    width: 100%;
    background: none;
    border: none;
    color: var(--sub);
    font-size: 14px;
    cursor: pointer;
    padding: 10px;
    font-family: 'Manrope', sans-serif;
  }

  /* datepicker compat */
  .dp-wrap { display: block; }
  .dp-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    text-align: left;
  }
  .dp-txt { flex: 1; color: var(--sub); }
  .dp-txt:not([data-empty="true"]) { color: var(--text); }
  .dp-cal-icon { width: 18px; height: 18px; color: var(--sub); flex-shrink: 0; }
  .dp-real-input { display: none; }
</style>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MiFinanza">
<meta name="theme-color" content="#6366f1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
</head>
<body>
<div class="phone">

  <!-- HEADER -->
  <div class="header" id="header-saludo" style="visibility:hidden">
    <div class="header-left">
      <div class="header-day" id="header-dia">HOY</div>
      <div class="greeting">
        <div class="nombre" id="saludo-nombre">Hola, Usuario 👋</div>
      </div>
    </div>
    <div class="avatar" id="avatar-header">?</div>
  </div>

  <!-- PERIOD SELECTOR -->
  <div class="period-bar">
    <button class="mes-arrow" onclick="mesAnterior()">&#8249;</button>
    <div class="period-center">
      <div class="mes-label-small">Resumen del mes</div>
      <div id="mes-badge">—</div>
    </div>
    <button class="mes-arrow" onclick="mesSiguiente()">&#8250;</button>
  </div>

  <!-- HERO CARD -->
  <div class="hero-card">
    <div class="hero-top">
      <div class="hero-left">
        <div class="saldo-label">Saldo actual</div>
        <div class="saldo-amount" id="saldo-amount">$0</div>
      </div>
      <!-- Health Ring -->
      <div class="health-ring-wrap">
        <svg viewBox="0 0 72 72" width="72" height="72">
          <circle class="health-ring-bg" cx="36" cy="36" r="30"/>
          <circle class="health-ring-fg" id="health-ring" cx="36" cy="36" r="30"/>
        </svg>
        <div class="health-pct">
          <span id="health-pct-val">—</span>
          <span class="health-pct-sub">salud</span>
        </div>
      </div>
    </div>
    <!-- Sparkline -->
    <div class="sparkline-wrap">
      <svg class="sparkline-svg" id="sparkline-svg" viewBox="0 0 320 40" preserveAspectRatio="none">
        <polyline id="sparkline-line" fill="none" stroke="rgba(99,102,241,0.5)" stroke-width="1.5" stroke-linejoin="round" points="0,30 64,25 128,28 192,20 256,18 320,15"/>
        <polyline id="sparkline-fill" fill="url(#spark-grad)" stroke="none" points="0,30 64,25 128,28 192,20 256,18 320,15 320,40 0,40"/>
        <defs>
          <linearGradient id="spark-grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="rgba(99,102,241,0.25)"/>
            <stop offset="100%" stop-color="rgba(99,102,241,0)"/>
          </linearGradient>
        </defs>
        <!-- dot at current month -->
        <circle id="sparkline-dot" cx="320" cy="15" r="3.5" fill="var(--accent)"/>
      </svg>
      <div class="sparkline-months" id="sparkline-months">
        <span>May</span><span>Jun</span><span>Jul</span><span>Ago</span><span>Sep</span><span>Oct</span>
      </div>
    </div>
  </div>

  <!-- PILLS: Ingresos / Gastos -->
  <div class="pills-row">
    <div class="pill">
      <div class="pill-dot green"></div>
      <div class="pill-info">
        <div class="pill-lbl">Ingresos</div>
        <div class="pill-val green" id="total-ingresos">$0</div>
      </div>
    </div>
    <div class="pill">
      <div class="pill-dot red"></div>
      <div class="pill-info">
        <div class="pill-lbl">Gastos</div>
        <div class="pill-val red" id="total-gastos">$0</div>
      </div>
    </div>
  </div>

  <!-- GASTOS FIJOS -->
  <a href="mifinanza-fijos.html" style="display:block;text-decoration:none;color:inherit;position:relative;z-index:2;">
  <div class="fijos-card">
    <div class="section-header">
      <span class="section-title">Gastos fijos</span>
      <span class="section-total" id="fijos-total">$0</span>
    </div>
    <div id="fijos-lista"><div style="color:var(--sub);font-size:13px;text-align:center;padding:10px">Cargando...</div></div>
  </div>
  </a>

  <!-- ÚLTIMO MOVIMIENTO -->
  <div class="ultimo-card" onclick="location.href='mifinanza-movimientos.html'" style="cursor:pointer;">
    <div class="ultimo-icon">📋</div>

    <button onclick="guardarFijo()" class="btn-ok" style="background:var(--accent);color:#fff">Guardar gasto fijo</button>

<div class="toast" id="toast"></div>

<script>
  // ── Fecha en header ──
  ;(function() {
    const dias = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado']
    const meses2 = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre']
    const hoyDate = new Date()
    const el = document.getElementById('header-dia')
    if (el) el.textContent = dias[hoyDate.getDay()].toUpperCase() + ', ' + hoyDate.getDate() + ' DE ' + meses2[hoyDate.getMonth()].toUpperCase()
  })()

  window.moneda = localStorage.getItem('moneda') || '$'
  const _color = localStorage.getItem('color'); if (_color) document.documentElement.style.setProperty('--accent', _color)
  const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre']
  const hoy = new Date().toISOString().split('T')[0]
  let mesVer  = new Date().getMonth()
  let anioVer = new Date().getFullYear()

  function actualizarCabecera() {
    document.getElementById('mes-badge').textContent = meses[mesVer].toUpperCase() + ' ' + anioVer
  }
  actualizarCabecera()

  function mesAnterior() {
    mesVer--; if (mesVer < 0) { mesVer = 11; anioVer-- }
    actualizarCabecera(); cargarDashboard()
  }
  function mesSiguiente() {
    mesVer++; if (mesVer > 11) { mesVer = 0; anioVer++ }
    actualizarCabecera(); cargarDashboard()
  }

  // ── Health ring ──
  function actualizarHealthRing(pct) {
    const circumference = 2 * Math.PI * 30  // r=30 → ~188.5
    const ring = document.getElementById('health-ring')
    const pctEl = document.getElementById('health-pct-val')
    const saldoEl = document.getElementById('saldo-amount')
    const clampedPct = Math.max(0, Math.min(100, pct))
    const offset = circumference * (1 - clampedPct / 100)
    ring.style.strokeDashoffset = offset
    pctEl.textContent = Math.round(clampedPct) + '%'
    if (pct < 0) {
      ring.classList.add('negativo')
      saldoEl.className = 'saldo-amount negativo'
    } else {
      ring.classList.remove('negativo')
      saldoEl.className = 'saldo-amount positivo'
    }
  }

  async function cargarDashboard() {
    let uid = window.currentUserId
    if (!uid) {
      uid = await new Promise(resolve => {
        const iv = setInterval(() => {
          if (window.currentUserId) { clearInterval(iv); resolve(window.currentUserId) }
        }, 50)
        setTimeout(() => { clearInterval(iv); resolve(null) }, 5000)
      })
    }
    if (!uid) return

    const { data: perfil } = await dbClient.from('perfil').select('nombre').eq('usuario_id', uid).single()
    if (perfil?.nombre) {
      document.getElementById('saludo-nombre').textContent = 'Hola, ' + perfil.nombre + ' 👋'
      document.getElementById('avatar-header').textContent = perfil.nombre[0].toUpperCase()
    }
    document.getElementById('header-saludo').style.visibility = 'visible'

    const inicio = anioVer + '-' + String(mesVer + 1).padStart(2,'0') + '-01'
    const ultimoDia = new Date(anioVer, mesVer + 1, 0).getDate()
    const fin    = anioVer + '-' + String(mesVer + 1).padStart(2,'0') + '-' + String(ultimoDia).padStart(2,'0')
    console.log('[dashboard] uid:', uid, 'inicio:', inicio, 'fin:', fin)
    const { data: todosIngresos } = await dbClient.from('ingresos').select('fecha,monto').eq('usuario_id', uid).order('fecha', { ascending: false }).limit(10)
    console.log('[dashboard] TODOS los ingresos del usuario (sin filtro de fecha):', todosIngresos)
    const [{ data: gastos, error: eGas }, { data: ingresos, error: eIng }, { data: fijos, error: eFij }] = await Promise.all([
      dbClient.from('gastos').select('*').eq('usuario_id', uid).gte('fecha', inicio).lte('fecha', fin),
      dbClient.from('ingresos').select('*').eq('usuario_id', uid).gte('fecha', inicio).lte('fecha', fin),
      dbClient.from('gastos_fijos').select('*').eq('usuario_id', uid).lte('fecha_inicio', fin).or(`fecha_fin.gte.${inicio},fecha_fin.is.null`)
    ])
    const { data: metas } = await dbClient.from('metas').select('*').eq('usuario_id', uid).eq('es_principal', true).maybeSingle()

    console.log('[dashboard] gastos mes:', gastos?.length, eGas?.message)
    console.log('[dashboard] ingresos mes:', ingresos, 'error:', eIng?.message)
    console.log('[dashboard] fijos:', fijos?.length, eFij?.message)
    const totalGas = (gastos   || []).reduce((s, g) => s + parseFloat(g.monto), 0)
    const totalIng = (ingresos || []).reduce((s, i) => s + parseFloat(i.monto), 0)
    const totalFij = (fijos    || []).reduce((s, f) => s + parseFloat(f.monto), 0)
    const saldo    = totalIng - totalGas - totalFij

    document.getElementById('total-ingresos').textContent = window.moneda + totalIng.toLocaleString()
    document.getElementById('total-gastos').textContent   = window.moneda + (totalGas + totalFij).toLocaleString()
    document.getElementById('fijos-total').textContent    = window.moneda + totalFij.toLocaleString()

    const amount = document.getElementById('saldo-amount')
    if (saldo < 0) {
      amount.textContent = '-' + window.moneda + Math.abs(saldo).toLocaleString()
    } else {
      amount.textContent = window.moneda + saldo.toLocaleString()
    }

    // Health ring: % de ingresos que queda disponible
    const pct = totalIng > 0 ? Math.max(-10, (saldo / totalIng) * 100) : 0
    actualizarHealthRing(pct)

    // Gastos fijos con barra de progreso
    const listaFijos = document.getElementById('fijos-lista')
    listaFijos.innerHTML = ''
    ;(fijos || []).forEach(f => {
      const cat   = f.categoria || ''
      const first = [...cat.trim()][0]
      const icon  = first && first.codePointAt(0) > 127 ? first : '📦'
      const montoFijo = parseFloat(f.monto)
      // barra: cuánto representa este fijo del total de fijos
      const barPct = totalFij > 0 ? Math.min(100, (montoFijo / totalFij) * 100) : 0
      const div = document.createElement('div')
      div.className = 'fijo-item'
      div.innerHTML = `
        <div class="fijo-row">
          <div class="fijo-left">
            <div class="fijo-icon">${icon}</div>
            <div><div class="fijo-name">${f.nombre}</div><div class="fijo-date">Desde ${f.fecha_inicio}</div></div>
          </div>
          <div class="fijo-amount">${window.moneda}${f.monto}</div>
        </div>
        <div class="fijo-bar-track"><div class="fijo-bar-fill" style="width:${barPct}%"></div></div>
      `
      listaFijos.appendChild(div)
    })

    const { data: ultimo } = await dbClient.from('gastos').select('*').eq('usuario_id', uid).order('fecha', { ascending: false }).limit(1)
    if (ultimo && ultimo.length > 0) {
      const u = ultimo[0]
      document.getElementById('ultimo-desc').textContent  = u.descripcion
      document.getElementById('ultimo-date').textContent  = u.fecha + ' · ' + u.categoria
      document.getElementById('ultimo-monto').textContent = '-' + window.moneda + parseFloat(u.monto).toLocaleString()
    }
  }

  cargarDashboard()

  function abrirPanelMas() { document.getElementById('panel-mas').style.display = 'flex' }
  function cerrarPanelMas() { document.getElementById('panel-mas').style.display = 'none' }
  document.getElementById('panel-mas').addEventListener('click', function(e) { if (e.target === this) cerrarPanelMas() })

  const CATS_DEFAULT = '🏠 Alquiler,💳 Crédito,📱 Línea,🏋️ Gym,⛽ Gasolina,💻 Tecnología,❤️ Salud,👕 Ropa,🎉 Salidas,🌍 Remesas,⚠️ Gastos Imprevistos,📋 Trámite,🚗 Vehículo,📦 Otros,🛒 Supermercado,💧 Agua,🧴 Cuidado personal,📺 Suscripción,💡 Luz,🌐 Internet,💼 Nómina'

  async function cargarCategoriasPerfil() {
    const uid = window.currentUserId
    if (!uid) return
    const { data: rows } = await dbClient.from('perfil').select('categorias').eq('usuario_id', uid).limit(1)
    const catsStr = rows?.[0]?.categorias || CATS_DEFAULT
    const cats = [...new Set(catsStr.split(',').map(c => c.trim()).filter(Boolean))]
    const sk = s => s.replace(/^[^\p{L}]+/u, '').toLowerCase()
    cats.sort((a, b) => sk(a).localeCompare(sk(b), 'es'))
    ;['g-categoria', 'f-categoria'].forEach(id => {
      const sel = document.getElementById(id)
      if (sel) sel.innerHTML = cats.map(c => `<option>${c}</option>`).join('')
    })
  }

  function toast(msg, tipo = 'ok') {
    const t = document.getElementById('toast')
    t.textContent = msg
    t.className = `toast ${tipo} show`
    setTimeout(() => { t.className = 'toast' }, 2500)
  }

  let nuevaCatTarget = null

  function toggleNuevaCat(targetId) {
    nuevaCatTarget = targetId
    const panel = document.getElementById('panel-nueva-cat')
    panel.style.display = 'block'
    document.getElementById('nueva-cat-input').value = ''
    document.getElementById('nueva-cat-input').focus()
  }

  function cerrarNuevaCat() {
    document.getElementById('panel-nueva-cat').style.display = 'none'
    document.getElementById('nueva-cat-input').value = ''
  }

  async function guardarNuevaCategoria() {
    const nueva = document.getElementById('nueva-cat-input').value.trim()
    if (!nueva) { alert('Escribe una categoría'); return }
    const uid = window.currentUserId
    if (!uid) return

    const { data: rows } = await dbClient.from('perfil').select('id, categorias').eq('usuario_id', uid).limit(1)
    const perfilRow = rows?.[0]
    const catsStr = perfilRow?.categorias || CATS_DEFAULT
    const cats = catsStr.split(',').map(c => c.trim()).filter(Boolean)
    if (cats.includes(nueva)) { alert('Esa categoría ya existe'); return }
    cats.push(nueva)
    const nuevaLista = cats.join(',')

    let error
    if (perfilRow) {
      ;({ error } = await dbClient.from('perfil').update({ categorias: nuevaLista }).eq('id', perfilRow.id))
    } else {
      ;({ error } = await dbClient.from('perfil').insert({ usuario_id: uid, categorias: nuevaLista }))
    }
    if (error) { alert('Error: ' + error.message); return }

    ;['g-categoria', 'f-categoria'].forEach(id => {
      const sel = document.getElementById(id)
      if (sel) sel.innerHTML += `<option>${nueva}</option>`
    })
    if (nuevaCatTarget) document.getElementById(nuevaCatTarget).value = nueva

    cerrarNuevaCat()
    toast('✅ Categoría añadida')
  }

  function abrirMenu()       { document.getElementById('menu-fab').style.display = 'flex' }
  function cerrarMenu()      { document.getElementById('menu-fab').style.display = 'none' }
  async function abrirGasto()     { cerrarMenu(); document.getElementById('g-fecha').value = hoy; await cargarCategoriasPerfil(); document.getElementById('modal-gasto').style.display = 'flex' }
  function cerrarGasto()     { document.getElementById('modal-gasto').style.display = 'none' }
  function abrirIngreso()    { cerrarMenu(); document.getElementById('i-fecha').value = hoy; document.getElementById('modal-ingreso').style.display = 'flex' }
  function cerrarIngreso()   { document.getElementById('modal-ingreso').style.display = 'none' }
  async function abrirGastoFijo() { cerrarMenu(); document.getElementById('f-nombre').value=''; document.getElementById('f-monto').value=''; document.getElementById('f-fecha').value=''; document.getElementById('f-fecha-fin').value=''; await cargarCategoriasPerfil(); document.getElementById('modal-fijo').style.display = 'flex' }
  function cerrarGastoFijo() { document.getElementById('modal-fijo').style.display = 'none' }

  async function guardarGasto() {
    const fecha       = document.getElementById('g-fecha').value
    const descripcion = document.getElementById('g-descripcion').value.trim()
    const categoria   = document.getElementById('g-categoria').value
    const monto       = parseFloat(document.getElementById('g-monto').value)
    if (!descripcion || isNaN(monto)) { alert('Completa descripción y monto'); return }
    const { error } = await dbClient.from('gastos').insert([{ fecha, descripcion, categoria, monto, usuario_id: window.currentUserId, origen: 'manual' }])
    if (error) { alert('Error: ' + error.message) }
    else { alert('✅ Gasto guardado'); cerrarGasto(); cargarDashboard() }
  }

  async function guardarIngreso() {
    const fecha    = document.getElementById('i-fecha').value
    const concepto = document.getElementById('i-concepto').value.trim()
    const tipo     = document.getElementById('i-tipo').value
    const monto    = parseFloat(document.getElementById('i-monto').value)
    if (!concepto || isNaN(monto)) { alert('Completa concepto y monto'); return }
    const { error } = await dbClient.from('ingresos').insert([{ fecha, concepto, tipo, monto, usuario_id: window.currentUserId, origen: 'manual' }])
    if (error) { alert('Error: ' + error.message) }
    else { alert('✅ Ingreso guardado'); cerrarIngreso(); cargarDashboard() }
  }

  async function guardarFijo() {
    const nombre    = document.getElementById('f-nombre').value.trim()
    const categoria = document.getElementById('f-categoria').value
    const monto     = parseFloat(document.getElementById('f-monto').value)
    const fecha     = document.getElementById('f-fecha').value
    const fechaFin  = document.getElementById('f-fecha-fin').value || null
    if (!nombre || isNaN(monto) || !fecha) { alert('Completa todos los campos'); return }
    const dia = new Date(fecha).getDate()
    const { error } = await dbClient.from('gastos_fijos').insert([{ nombre, categoria, monto, dia_del_mes: dia, activo: true, fecha_inicio: fecha, fecha_fin: fechaFin, usuario_id: window.currentUserId }])
    if (error) { alert('Error: ' + error.message) }
    else { alert('✅ Gasto fijo guardado'); cerrarGastoFijo(); cargarDashboard() }
  }
</script>

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }
</script>
