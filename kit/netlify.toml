# Página del QR del Kit de Seguridad Infantil (ALFREGA).
# En Netlify, el sitio del kit usa como «Base directory» esta carpeta (kit), así que publica solo esto.
[build]
  publish = "."

# El contacto de ALFREGA (botón «Guardar contacto»): que el móvil lo abra como contacto
[[headers]]
  for = "/alfrega.vcf"
  [headers.values]
    Content-Type = "text/vcard; charset=utf-8"
    Content-Disposition = "inline; filename=ALFREGA.vcf"
